[package]
name = "cosmos"
version = "1.29.0"
description = "MondoWrite : du chaos au monde ordonné, une toile pour les écrivains"
authors = ["Sébastien Piconnier"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/sebastienpiconnier/MondoWrite"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cosmos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }
# Apple Foundation Models : compile le pont Swift (apple/MondoWriteFM) sur un Mac, pour macOS et iOS (build.rs).
# Toujours déclaré (code Rust pur) ; build.rs ne l'appelle que sur un Mac.
swift-rs = { version = "1.0.8", features = ["build"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }

# Mises à jour de l'app (ordinateur seulement : sur mobile, ce sont les boutiques).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Surveillance du dossier du projet (modifications faites dans un autre logiciel), ordinateur seulement.
tauri-plugin-fs = { version = "2", features = ["watch"] }

# iPhone, iPad et Mac : conteneur iCloud de l'app (son chemin, téléchargement des fichiers distants).
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSFileManager", "NSObject", "NSString", "NSURL"] }

# iPhone et iPad : sélecteur de dossiers de l'app Fichiers (OneDrive, Dropbox, Drive…) et signet d'accès durable.
[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-uniform-type-identifiers", "UIApplication", "UIDocumentPickerViewController", "UIResponder", "UIViewController", "UIWindow"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }


# Clés de l'auteur dans le trousseau du système (#30, src/secrets.rs). Android : pas de trousseau, les clés restent
# dans les réglages de l'appareil. Linux : Secret Service par D-Bus en Rust pur (zbus, MIT), sans libdbus (sa licence,
# AFL ou GPL, n'est pas dans la liste de CONTRIBUTING.md). Les appels passent par spawn_blocking (secrets.rs).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3"
features = ["async-secret-service", "tokio", "crypto-rust"]

[patch.crates-io]
num_threads = { path = "vendor/num_threads" }
