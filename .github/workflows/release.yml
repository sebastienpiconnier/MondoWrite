# Fabrique les installeurs Mac (Apple Silicon et Intel), Windows et Linux
# quand on pousse une étiquette de version :  git tag v0.2.0 && git push --tags
# ou à la main (onglet Actions, « Run workflow ») : l'étiquette vient alors de la version de l'app
# (package.json, tauri.conf.json), par exemple v0.1.0, et tauri-action la crée.
# Résultat : un brouillon de « Release » GitHub avec .dmg, .msi/.exe, .AppImage/.deb.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # Signature et notarisation Apple, seulement si les secrets du dépôt sont posés
      # (Settings › Secrets and variables › Actions) : APPLE_CERTIFICATE (.p12 en base64),
      # APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY (identifiant
      # de la clé) et APPLE_API_PRIVATE_KEY (contenu du fichier .p8). Sans eux, l'app sort non signée.
      - name: Signature Apple (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Pas de certificat Apple : installeurs non signés."
            exit 0
          fi
          {
            # Base64 sur une seule ligne (un retour à la ligne casserait $GITHUB_ENV).
            echo "APPLE_CERTIFICATE=$(printf '%s' "$APPLE_CERTIFICATE" | tr -d '\r\n ')"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_PRIVATE_KEY" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
            key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
            printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
            {
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
              echo "APPLE_API_KEY=$APPLE_API_KEY"
              echo "APPLE_API_KEY_PATH=$key_path"
            } >> "$GITHUB_ENV"
            echo "Signature et notarisation Apple activées."
          else
            echo "Signature Apple activée, sans notarisation (clé d'API absente)."
          fi

      # Mises à jour dans l'app, seulement si les secrets du dépôt sont posés : TAURI_SIGNING_PRIVATE_KEY
      # (contenu du fichier de clé privée), TAURI_SIGNING_PRIVATE_KEY_PASSWORD (son mot de passe) et
      # TAURI_UPDATER_PUBKEY (contenu du fichier .pub). Les installeurs sont alors signés pour la mise à jour,
      # l'app reçoit la clé publique et la Release porte latest.json. Sans eux, l'app propose seulement la
      # page de téléchargement de chaque nouvelle version.
      - name: Signature des mises à jour
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] || [ -z "$TAURI_UPDATER_PUBKEY" ]; then
            echo "::notice::Pas de clé de mise à jour : l'app proposera la page de téléchargement."
            exit 0
          fi
          key=$(printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | tr -d '\r\n ')
          {
            echo "TAURI_SIGNING_PRIVATE_KEY=$key"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          # La clé publique et les fichiers de mise à jour sont écrits dans tauri.conf.json (sur cette machine
          # seulement, rien n'est poussé) : tauri-action relit ce fichier pour trouver les .sig et écrire latest.json.
          node -e '
            const fs = require("fs");
            const file = "src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.bundle.createUpdaterArtifacts = true;
            conf.plugins.updater.pubkey = process.env.TAURI_UPDATER_PUBKEY.replace(/\s+/g, "");
            fs.writeFileSync(file, JSON.stringify(conf, null, 2));
          '
          echo "::notice::Mises à jour signées : latest.json sera joint à la Release."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Lancé par une étiquette : celle-ci. Lancé à la main : v + la version de l'app (jamais « main »).
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "MondoWrite ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            MondoWrite pour macOS (Apple Silicon et Intel), Windows et Linux. *English below.*

            Anciennement Cosmos : seul le nom change, tes projets et tes réglages restent les mêmes.

            **Installer**
            - macOS : ouvre le .dmg (aarch64 pour un Mac Apple Silicon, x64 pour un Mac Intel) et glisse MondoWrite dans Applications. L'app est signée et vérifiée par Apple.
            - Windows : lance le .exe (ou le .msi). L'app n'est pas encore signée : si SmartScreen s'affiche, « Informations complémentaires » puis « Exécuter quand même ».
            - Linux : AppImage, .deb ou .rpm.

            Mises à jour : MondoWrite te prévient d'une nouvelle version (Réglages, « Mises à jour ») et l'installe d'un clic. Tes projets restent des dossiers de fichiers Markdown, lisibles hors de l'app.

            ---

            MondoWrite for macOS (Apple Silicon and Intel), Windows and Linux.

            Formerly Cosmos: only the name changes, your projects and settings stay the same.

            **Install**
            - macOS: open the .dmg (aarch64 for an Apple Silicon Mac, x64 for an Intel Mac) and drag MondoWrite to Applications. The app is signed and verified by Apple.
            - Windows: run the .exe (or the .msi). The app isn't signed yet: if SmartScreen appears, click “More info”, then “Run anyway”.
            - Linux: AppImage, .deb or .rpm.

            Updates: MondoWrite tells you when a new version is out (Settings, “Updates”) and installs it in one click. Your projects remain folders of Markdown files, readable outside the app.
          # Brouillon à relire puis publier à la main. Pas de préversion : seule une version publiée normale
          # est « la dernière », celle que l'app trouve (latest.json, API de GitHub).
          releaseDraft: true
          prerelease: false
          # latest.json est écrit une seule fois, par la tâche « latest-json » ci-dessous : les quatre
          # fabrications l'écrivaient en même temps et la dernière effaçait les autres plateformes.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Mises à jour dans l'app : latest.json pour toutes les plateformes, d'après les .sig de la Release.
  latest-json:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: echo "tag=${{ github.ref_type == 'tag' && github.ref_name || '' }}" >> "$GITHUB_OUTPUT"
      - name: latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Lancé à la main : v + la version de l'app, comme tauri-action.
          if [ -z "$RELEASE_TAG" ]; then RELEASE_TAG="v$(node -p 'require("./package.json").version')"; fi
          RELEASE_TAG="$RELEASE_TAG" node scripts/updater-json.mjs
