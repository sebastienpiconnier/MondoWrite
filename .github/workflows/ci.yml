# Vérification à chaque push : le front compile (TypeScript strict + Vite)
# et la partie Rust compile sur les trois systèmes de bureau.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    # Ubuntu 24.04 et pas « latest » : ubuntu-latest passe à Ubuntu 26 (octobre 2026), que l'installeur
    # de dépendances de playwright-core 1.56 ne connaît pas encore (étape Chromium en échec).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Tests de bout en bout dans Chromium (scripts/e2e/run.mjs) : version du navigateur
      # attendue par le playwright-core du projet.
      - name: Chromium pour les tests de bout en bout
        run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - name: Captures des tests de bout en bout échoués
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-captures
          path: scripts/e2e/captures/
          if-no-files-found: ignore

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      # Apple Foundation Models (1.10.0) : le framework n'est que dans le SDK de macOS 26 et d'iOS 26 (Xcode 26).
      # On choisit le plus récent Xcode 26 stable de l'image ; sans lui, build.rs ne compile pas le pont Swift et
      # l'app sort sans le service Apple Intelligence (avertissement ci-dessous), le reste n'est pas touché.
      - name: Xcode 26 (Apple Foundation Models)
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode/Contents/Developer"; else echo "::warning::Xcode 26 absent de l'image : Apple Intelligence ne sera pas dans cette version."; fi
          xcodebuild -version
          ls "$(xcrun --sdk macosx --show-sdk-path)/System/Library/Frameworks" | grep -q '^FoundationModels.framework$' && echo "SDK : FoundationModels présent" || echo "::warning::SDK sans FoundationModels"

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Front (requis par tauri::generate_context)
        run: npm ci && npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
