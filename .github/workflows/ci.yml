# Vérification à chaque push : le front compile (TypeScript strict + Vite)
# et la partie Rust compile sur les trois systèmes de bureau.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    # Ubuntu 24.04 et pas « latest » : ubuntu-latest passe à Ubuntu 26 (octobre 2026), que l'installeur
    # de dépendances de playwright-core 1.56 ne connaît pas encore (étape Chromium en échec).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Tests de bout en bout dans Chromium (scripts/e2e/run.mjs) : version du navigateur
      # attendue par le playwright-core du projet.
      - name: Chromium pour les tests de bout en bout
        run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - name: Captures des tests de bout en bout échoués
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-captures
          path: scripts/e2e/captures/
          if-no-files-found: ignore

  rust:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances système (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Front (requis par tauri::generate_context)
        run: npm ci && npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
